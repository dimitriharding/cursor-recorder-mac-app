name: CursorRecorder
options:
  bundleIdPrefix: com.qualityworks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  CursorRecorder:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CursorRecorder
        excludes:
          - "Resources/Cursors/**"
      - path: CursorRecorder/Resources/Cursors
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qualityworks.CursorRecorder
        INFOPLIST_FILE: CursorRecorder/Info.plist
        CODE_SIGN_ENTITLEMENTS: CursorRecorder/CursorRecorder.entitlements
        PRODUCT_NAME: "Cursor Recorder"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
